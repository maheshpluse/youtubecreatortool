<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Email Marketing for Creators: The Only Audience You Actually Own">
  <defs>
    <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff0000" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0000" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e1e1e" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0f0f0f"/>
  <rect width="1200" height="630" fill="url(#gGrid)" opacity=".55"/>
  <circle cx="1050" cy="90" r="330" fill="url(#gGlow)"/>
  <rect width="1200" height="6" fill="#ff0000"/>

  <!-- motif panel -->
  <rect x="668" y="100" width="460" height="430" rx="18" fill="#0f0f0f" fill-opacity=".72" stroke="#303030" stroke-width="1"/>
<path d="M726 188 L1070 188 L1020 245 L776 245 Z" fill="#ff0000" opacity="0.92"/>
<rect x="837" y="212" width="122" height="8" rx="4" fill="#0f0f0f" opacity=".38"/>
<path d="M776 257 L1020 257 L981 314 L815 314 Z" fill="#d81f1f" opacity="0.79"/>
<rect x="856" y="282" width="83" height="8" rx="4" fill="#0f0f0f" opacity=".38"/>
<path d="M815 326 L981 326 L950 383 L846 383 Z" fill="#a52020" opacity="0.66"/>
<rect x="872" y="350" width="52" height="8" rx="4" fill="#0f0f0f" opacity=".38"/>
<path d="M846 395 L950 395 L937 452 L859 452 Z" fill="#6e1c1c" opacity="0.53"/>
<rect x="878" y="420" width="39" height="8" rx="4" fill="#0f0f0f" opacity=".38"/>

  <!-- headline block -->
  <rect x="72" y="174" width="46" height="4" rx="2" fill="#ff0000"/>
  <text x="72" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff0000" letter-spacing="2.2">MARKETING</text>
    <text x="72" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="#f1f1f1" letter-spacing="-.5">Conversion funnel</text>
  <text x="72" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#717171">Reach narrowing down to conversion</text>

  <!-- footer lockup -->
  <g transform="translate(72 566)">
    <rect x="0" y="-16" width="30" height="30" rx="8" fill="#ff0000"/>
    <polygon points="11,-8 11,6 22,-1" fill="#fff"/>
    <text x="42" y="6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#f1f1f1">VidSEOKit<tspan fill="#717171">.com</tspan></text>
  </g>
</svg>
