<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="High CPC Keywords and the YouTube Niches That Attract Them">
  <defs>
    <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff0000" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0000" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e1e1e" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0f0f0f"/>
  <rect width="1200" height="630" fill="url(#gGrid)" opacity=".55"/>
  <circle cx="1050" cy="90" r="330" fill="url(#gGlow)"/>
  <rect width="1200" height="6" fill="#ff0000"/>

  <!-- motif panel -->
  <rect x="668" y="100" width="460" height="430" rx="18" fill="#0f0f0f" fill-opacity=".72" stroke="#303030" stroke-width="1"/>
<rect x="702" y="373" width="44" height="97" rx="4" fill="#3a3a3a"/>
<rect x="760" y="321" width="44" height="149" rx="4" fill="#3a3a3a"/>
<rect x="818" y="300" width="44" height="170" rx="4" fill="#3a3a3a"/>
<rect x="876" y="245" width="44" height="225" rx="4" fill="#3a3a3a"/>
<rect x="934" y="219" width="44" height="251" rx="4" fill="#3a3a3a"/>
<rect x="992" y="192" width="44" height="278" rx="4" fill="#ff0000"/>
<rect x="1050" y="164" width="44" height="306" rx="4" fill="#ff0000"/>
<path d="M724 373 L782 321 L840 300 L898 245 L956 219 L1014 192 L1072 164" fill="none" stroke="#3ea6ff" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
<circle cx="1014" cy="192" r="4" fill="#3ea6ff"/>
<circle cx="1072" cy="164" r="4" fill="#3ea6ff"/>
<line x1="702" y1="471" x2="1094" y2="471" stroke="#303030" stroke-width="2"/>

  <!-- headline block -->
  <rect x="72" y="174" width="46" height="4" rx="2" fill="#ff0000"/>
  <text x="72" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff0000" letter-spacing="2.2">MONETIZATION</text>
    <text x="72" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="#f1f1f1" letter-spacing="-.5">Revenue growth</text>
  <text x="72" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#717171">Revenue per thousand views, month</text>
  <text x="72" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#717171">over month</text>

  <!-- footer lockup -->
  <g transform="translate(72 566)">
    <rect x="0" y="-16" width="30" height="30" rx="8" fill="#ff0000"/>
    <polygon points="11,-8 11,6 22,-1" fill="#fff"/>
    <text x="42" y="6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#f1f1f1">CreatorTools<tspan fill="#717171">.io</tspan></text>
  </g>
</svg>
