<line x1="898" y1="321" x2="1036" y2="400" stroke="#1e1e1e" stroke-width="1"/>
<line x1="898" y1="321" x2="898" y2="480" stroke="#1e1e1e" stroke-width="1"/>
<line x1="898" y1="321" x2="760" y2="401" stroke="#1e1e1e" stroke-width="1"/>
