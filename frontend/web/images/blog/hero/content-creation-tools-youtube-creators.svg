<rect x="1016" y="428" width="30" height="30" rx="8" fill="#333" opacity="0.8"/>

  <!-- headline block -->
  <rect x="72" y="174" width="46" height="4" rx="2" fill="#ff0000"/>
  <text x="72" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff0000" letter-spacing="2.2">TOOLS</text>
    <text x="72" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="#f1f1f1" letter-spacing="-.5">Creator toolkit</text>
  <text x="72" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#717171">The tools worth paying for</text>

  <!-- footer lockup -->
  <g transform="translate(72 566)">
    <rect x="0" y="-16" width="30" height="30" rx="8" fill="#ff0000"/>
    <polygon points="11,-8 11,6 22,-1" fill="#fff"/>
    <text x="42" y="6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#f1f1f1">CreatorTools<tspan fill="#717171">.io</tspan></text>
