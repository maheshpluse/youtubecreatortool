<rect x="706" y="279" width="117" height="99" rx="10" fill="#181818" stroke="#303030" stroke-width="1"/>
<rect x="750" y="313" width="30" height="30" rx="8" fill="#333" opacity="0.8"/>
<rect x="839" y="279" width="117" height="99" rx="10" fill="#181818" stroke="#303030" stroke-width="1"/>
<rect x="883" y="313" width="30" height="30" rx="8" fill="#333" opacity="0.8"/>
<rect x="973" y="279" width="117" height="99" rx="10" fill="#241414" stroke="#ff0000" stroke-width="2"/>
