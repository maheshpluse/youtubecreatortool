<rect x="706" y="393" width="117" height="99" rx="10" fill="#241414" stroke="#ff0000" stroke-width="2"/>
<rect x="750" y="428" width="30" height="30" rx="8" fill="#ff0000" opacity="0.9"/>
<rect x="839" y="393" width="117" height="99" rx="10" fill="#181818" stroke="#303030" stroke-width="1"/>
<rect x="883" y="428" width="30" height="30" rx="8" fill="#333" opacity="0.8"/>
