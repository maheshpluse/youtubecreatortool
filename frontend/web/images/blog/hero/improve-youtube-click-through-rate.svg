<rect x="847" y="319" width="101" height="6" rx="3" fill="#3a3a3a"/>
<rect x="974" y="244" width="120" height="68" rx="7" fill="#1c1c1c" stroke="#303030" stroke-width="1"/>
<rect x="983" y="319" width="80" height="6" rx="3" fill="#3a3a3a"/>
<rect x="702" y="346" width="120" height="68" rx="7" fill="#1c1c1c" stroke="#303030" stroke-width="1"/>
<rect x="711" y="420" width="84" height="6" rx="3" fill="#3a3a3a"/>
<rect x="838" y="346" width="120" height="68" rx="7" fill="#1c1c1c" stroke="#303030" stroke-width="1"/>
<rect x="847" y="420" width="103" height="6" rx="3" fill="#3a3a3a"/>
<rect x="974" y="346" width="120" height="68" rx="7" fill="#1c1c1c" stroke="#303030" stroke-width="1"/>
<rect x="983" y="420" width="89" height="6" rx="3" fill="#3a3a3a"/>
<path d="M788 294 l0 22 l5.5 -6 l4 9 l5 -2.4 l-4 -8.6 l8 -0.5 Z" fill="#f1f1f1" stroke="#0f0f0f" stroke-width="1.6" stroke-linejoin="round"/>
<text x="702" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#aaaaaa">CTR <tspan fill="#2ba640">8.1%</tspan></text>

  <!-- headline block -->
  <rect x="72" y="174" width="46" height="4" rx="2" fill="#ff0000"/>
  <text x="72" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff0000" letter-spacing="2.2">ANALYTICS</text>
    <text x="72" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="#f1f1f1" letter-spacing="-.5">Click-through rate</text>
  <text x="72" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#717171">One thumbnail earns the click</text>

  <!-- footer lockup -->
  <g transform="translate(72 566)">
    <rect x="0" y="-16" width="30" height="30" rx="8" fill="#ff0000"/>
    <polygon points="11,-8 11,6 22,-1" fill="#fff"/>
