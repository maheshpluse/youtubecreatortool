<line x1="898" y1="321" x2="1036" y2="400" stroke="#1e1e1e" stroke-width="1"/>
<line x1="898" y1="321" x2="898" y2="480" stroke="#1e1e1e" stroke-width="1"/>
<line x1="898" y1="321" x2="760" y2="401" stroke="#1e1e1e" stroke-width="1"/>
<line x1="898" y1="321" x2="760" y2="242" stroke="#1e1e1e" stroke-width="1"/>
<polygon points="898,245 976,276 979,368 898,412 817,368 816,274" fill="#717171" fill-opacity="0.13" stroke="#717171" stroke-width="2" stroke-linejoin="round"/>
