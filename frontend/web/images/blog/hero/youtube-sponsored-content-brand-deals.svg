<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Sponsored Content: How Small Channels Land (and Price) Brand Deals">
  <defs>
    <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff0000" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0000" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e1e1e" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0f0f0f"/>
  <rect width="1200" height="630" fill="url(#gGrid)" opacity=".55"/>
  <circle cx="1050" cy="90" r="330" fill="url(#gGlow)"/>
  <rect width="1200" height="6" fill="#ff0000"/>

  <!-- motif panel -->
  <rect x="668" y="100" width="460" height="430" rx="18" fill="#0f0f0f" fill-opacity=".72" stroke="#303030" stroke-width="1"/>
<rect x="706" y="163" width="107" height="18" rx="9" fill="#ff0000" opacity=".85"/>
<path d="M824 172 C906 172, 940 321.0, 1020 321.0" fill="none" stroke="#ff0000" stroke-width="20" stroke-linecap="round" opacity=".32"/>
<rect x="706" y="225" width="96" height="18" rx="9" fill="#d81f1f" opacity=".85"/>
<path d="M824 234 C906 234, 940 321.0, 1020 321.0" fill="none" stroke="#d81f1f" stroke-width="6" stroke-linecap="round" opacity=".32"/>
<rect x="706" y="287" width="98" height="18" rx="9" fill="#3ea6ff" opacity=".85"/>
<path d="M824 296 C906 296, 940 321.0, 1020 321.0" fill="none" stroke="#3ea6ff" stroke-width="14" stroke-linecap="round" opacity=".32"/>
<rect x="706" y="349" width="71" height="18" rx="9" fill="#2ba640" opacity=".85"/>
<path d="M824 358 C906 358, 940 321.0, 1020 321.0" fill="none" stroke="#2ba640" stroke-width="12" stroke-linecap="round" opacity=".32"/>
<circle cx="1046" cy="321" r="42" fill="#ff0000" opacity=".14"/>
<circle cx="1046" cy="321" r="30" fill="#ff0000"/>
<text x="1046" y="332" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">$</text>

  <!-- headline block -->
  <rect x="72" y="174" width="46" height="4" rx="2" fill="#ff0000"/>
  <text x="72" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff0000" letter-spacing="2.2">MARKETING</text>
    <text x="72" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="#f1f1f1" letter-spacing="-.5">Revenue streams</text>
  <text x="72" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#717171">Four income lines, one total</text>

  <!-- footer lockup -->
  <g transform="translate(72 566)">
    <rect x="0" y="-16" width="30" height="30" rx="8" fill="#ff0000"/>
    <polygon points="11,-8 11,6 22,-1" fill="#fff"/>
    <text x="42" y="6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#f1f1f1">CreatorTools<tspan fill="#717171">.io</tspan></text>
  </g>
</svg>
