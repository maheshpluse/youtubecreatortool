<text x="1082" y="354" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#aaaaaa">51K</text>
<rect x="702" y="374" width="392" height="34" rx="6" fill="#181818"/>
<rect x="702" y="374" width="206" height="34" rx="6" fill="#8a2626" opacity=".55"/>
<rect x="714" y="387" width="77" height="8" rx="4" fill="#f1f1f1" opacity=".55"/>
<text x="1082" y="396" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#aaaaaa">56K</text>
<circle cx="1054" cy="140" r="20" fill="none" stroke="#3ea6ff" stroke-width="4"/>
<line x1="1068" y1="154" x2="1082" y2="168" stroke="#3ea6ff" stroke-width="4" stroke-linecap="round"/>

  <!-- headline block -->
  <rect x="72" y="174" width="46" height="4" rx="2" fill="#ff0000"/>
  <text x="72" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff0000" letter-spacing="2.2">SEO</text>
    <text x="72" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="#f1f1f1" letter-spacing="-.5">Keyword volume</text>
  <text x="72" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#717171">Search volume behind each term</text>

  <!-- footer lockup -->
  <g transform="translate(72 566)">
    <rect x="0" y="-16" width="30" height="30" rx="8" fill="#ff0000"/>
    <polygon points="11,-8 11,6 22,-1" fill="#fff"/>
