<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The 8 YouTube Analytics Metrics That Actually Predict Growth">
  <defs>
    <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff0000" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0000" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e1e1e" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0f0f0f"/>
  <rect width="1200" height="630" fill="url(#gGrid)" opacity=".55"/>
  <circle cx="1050" cy="90" r="330" fill="url(#gGlow)"/>
  <rect width="1200" height="6" fill="#ff0000"/>

  <!-- motif panel -->
  <rect x="668" y="100" width="460" height="430" rx="18" fill="#0f0f0f" fill-opacity=".72" stroke="#303030" stroke-width="1"/>
<line x1="702" y1="470" x2="1094" y2="470" stroke="#1e1e1e" stroke-width="1"/>
<line x1="702" y1="369" x2="1094" y2="369" stroke="#1e1e1e" stroke-width="1"/>
<line x1="702" y1="269" x2="1094" y2="269" stroke="#1e1e1e" stroke-width="1"/>
<line x1="702" y1="168" x2="1094" y2="168" stroke="#1e1e1e" stroke-width="1"/>
<path d="M702 402 L751 376 L800 368 L849 346 L898 295 L947 268 L996 236 L1045 201 L1094 168 L1094 470 L702 470 Z" fill="url(#gArea)"/>
<path d="M702 402 L751 376 L800 368 L849 346 L898 295 L947 268 L996 236 L1045 201 L1094 168" fill="none" stroke="#ff0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1094" cy="168" r="7" fill="#ff0000" opacity=".25"/>
<circle cx="1094" cy="168" r="4" fill="#ff0000"/>
<line x1="702" y1="471" x2="1094" y2="471" stroke="#303030" stroke-width="2"/>

  <!-- headline block -->
  <rect x="72" y="174" width="46" height="4" rx="2" fill="#ff0000"/>
  <text x="72" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff0000" letter-spacing="2.2">ANALYTICS</text>
    <text x="72" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="#f1f1f1" letter-spacing="-.5">Traffic growth</text>
  <text x="72" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#717171">Traffic compounding across nine</text>
  <text x="72" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#717171">periods</text>

  <!-- footer lockup -->
  <g transform="translate(72 566)">
    <rect x="0" y="-16" width="30" height="30" rx="8" fill="#ff0000"/>
    <polygon points="11,-8 11,6 22,-1" fill="#fff"/>
    <text x="42" y="6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#f1f1f1">CreatorTools<tspan fill="#717171">.io</tspan></text>
