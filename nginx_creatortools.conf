# Redirect www to non-www (clean canonical URL)
server {
    listen 443 ssl;
    server_name www.creatortools.biz;

    ssl_certificate /etc/letsencrypt/live/creatortools.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creatortools.biz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://creatortools.biz$request_uri;
}

# Main server block
server {
    server_name creatortools.biz;

    root /var/www/creatortools/frontend;
    index index.html;

    # Remove index.html from URLs
    if ($request_uri ~ ^(.*)index\.html$) {
        return 301 $1;
    }

    # Remove trailing slashes (except root and adminx)
    rewrite ^/(?!adminx)(.*)/$ /$1 permanent;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin Panel Route
    location ^~ /adminx {
        alias /var/www/creatortools/admin_panel;
        try_files $uri $uri/ /adminx/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets for SEO speed
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/creatortools.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creatortools.biz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name creatortools.biz www.creatortools.biz;
    return 301 https://creatortools.biz$request_uri;
}
