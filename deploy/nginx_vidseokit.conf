# Canonical URL = no trailing slash.
#
# Keyed on $request_uri (the URI the client actually sent) rather than $uri.
# try_files' "$uri/" arm resolves a directory by *internally* rewriting $uri to
# "/blog/", which re-runs server-level rules; a $uri-based rewrite therefore
# bounced /blog/ -> /blog -> /blog/ forever and made the whole blog
# uncrawlable. $request_uri is untouched by internal redirects, so this cannot
# loop. /adminx keeps its trailing slash (the SPA's asset base depends on it).
map $request_uri $ct_canonical_redirect {
    default                                       "";
    "~^(?<p>/(?!adminx).*[^/])/$"                 $p;
    "~^(?<p>/(?!adminx).*[^/])/\?(?<q>.*)$"       "$p?$q";
}

# Redirect www to non-www (clean canonical URL)
server {
    listen 443 ssl;
    server_name www.vidseokit.com;

    ssl_certificate /etc/letsencrypt/live/vidseokit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidseokit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vidseokit.com$request_uri;
}

# Main server block
server {
    server_name vidseokit.com;

    root /var/www/vidseokit/frontend;
    index index.html;

    # Remove index.html from URLs
    if ($request_uri ~ ^(.*)index\.html$) {
        return 301 $1;
    }

    # Remove trailing slashes (except root and adminx). See the map above.
    if ($ct_canonical_redirect) {
        return 301 $ct_canonical_redirect;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Admin Panel Route
    location ^~ /adminx {
        alias /var/www/vidseokit/admin_panel;
        try_files $uri $uri/ /adminx/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compress text assets.
    #
    # nginx gzips text/html by default and nothing else, so main.dart.js was
    # shipping 427KB uncompressed on every first visit and took 5.6s to load,
    # which is most of the 6.9s domReady. The Dart bundle compresses to roughly
    # a quarter of that.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Cache static assets for SEO speed
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    #
    # HSTS tells browsers to reach this host over HTTPS only, which closes the
    # brief plaintext window on the first request of a session. Safe here: the
    # site is already HTTPS-only and :80 redirects. No `preload` — that ships
    # the domain in a browser-baked list and is slow and awkward to undo, so it
    # should be a deliberate decision rather than a side effect of this change.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vidseokit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidseokit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name vidseokit.com www.vidseokit.com;
    return 301 https://vidseokit.com$request_uri;
}
